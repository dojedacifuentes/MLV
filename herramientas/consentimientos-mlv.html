<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Prototipo: la página no puede conectarse a nada. Todo queda en este navegador. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Consentimientos MLV · prototipo</title>
<style>
  :root {
    /* Base técnica: grises fríos, un acento azul eléctrico y un verde/ámbar/rojo de estado. */
    --fondo: #f1f4f8; --papel: #ffffff; --papel2: #f7f9fc; --hundido: #e9edf3;
    --tinta: #0f172a; --tinta2: #334155; --suave: #64748b; --linea: #dbe2ea; --linea2: #e8edf3; --campo: #a4afbd;
    --acento: #1d5fd6; --acento-osc: #164bb0; --acento-claro: #e8f0ff; --acento-borde: #bcd0f7; --acento-tenue: rgba(29, 95, 214, .12);
    --navy: #0b1220; --navy2: #121c31; --navy-texto: #c7d2e3;
    --verde: #15803d; --verde-f: #ecfdf3; --verde-b: #a7e4bb; --verde-v: #22c55e;
    --ambar: #b45309; --ambar-f: #fff7e6; --ambar-b: #f5d48a; --ambar-v: #f59e0b;
    --rojo: #b91c1c; --rojo-f: #fef2f2; --rojo-b: #f5b5b5; --rojo-v: #ef4444;
    --gris-f: #eef2f6;
    --sans: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --radio: 12px; --radio-s: 8px;
    --sombra: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 3px rgba(15, 23, 42, .06);
    --sombra-2: 0 10px 30px -12px rgba(15, 23, 42, .25);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 14.5px/1.5 var(--sans); font-feature-settings: "tnum", "cv11"; }
  .app { max-width: 1320px; margin: 0 auto; padding: 0 28px 44px; }
  a { color: var(--acento); }
  h1, h2, h3 { font-family: var(--sans); font-weight: 650; color: var(--tinta); letter-spacing: -.01em; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }

  .demo-aviso { background: var(--navy); color: var(--navy-texto); font-size: 12.5px; text-align: center; padding: 6px 16px; letter-spacing: .01em; border-bottom: 1px solid rgba(255,255,255,.06); }
  .demo-aviso b { color: #fff; font-weight: 600; }

  /* Barra superior oscura, a todo el ancho */
  .barra-app { background: linear-gradient(180deg, var(--navy2), var(--navy)); color: #fff; border-bottom: 1px solid rgba(255,255,255,.08); }
  .barra-app .interior { max-width: 1320px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; }
  .marca-app { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #1d5fd6 60%, #0ea5e9); display: grid; place-items: center; font: 700 13px/1 var(--sans); letter-spacing: .04em; color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 6px 16px -6px rgba(59,130,246,.8); }
  .firma { font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .sub { color: #8b9bb4; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
  .cab-der { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; }
  .modo { display: inline-flex; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 3px; }
  .modo button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: none; padding: 7px 13px; cursor: pointer; color: #c7d2e3; border-radius: 7px; }
  .modo button:hover { color: #fff; }
  .modo button[aria-pressed="true"] { background: #fff; color: var(--navy); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .guardado { font-size: 12px; color: #8b9bb4; display: inline-flex; align-items: center; gap: 6px; }
  .guardado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--verde-v); box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
  .guardado.mal { color: #fbbf24; }
  .guardado.mal::before { background: var(--ambar-v); box-shadow: 0 0 0 3px rgba(245,158,11,.2); }

  .vistas { display: flex; flex-wrap: wrap; gap: 4px; margin: 18px 0 22px; padding: 4px; background: var(--hundido); border-radius: 11px; width: fit-content; max-width: 100%; }
  .vistas button { font: inherit; background: none; border: 0; padding: 8px 13px; color: var(--tinta2); border-radius: 8px; font-weight: 500; font-size: 13.5px; cursor: pointer; }
  .vistas button:hover { color: var(--tinta); }
  .vistas button[aria-current="page"] { color: var(--tinta); background: var(--papel); box-shadow: var(--sombra); font-weight: 600; }
  .vistas .cuenta-p { display: inline-block; min-width: 19px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--papel); color: var(--tinta2); font-size: 11.5px; text-align: center; font-weight: 600; border: 1px solid var(--linea); }
  .vistas .cuenta-p.rojo { background: var(--rojo-f); color: var(--rojo); border-color: var(--rojo-b); }
  .vistas .cuenta-p.ambar { background: var(--ambar-f); color: var(--ambar); border-color: var(--ambar-b); }
  @media (max-width: 700px) {
    .vistas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: auto; }
    .vistas button { min-height: 42px; padding: 6px 4px; font-size: 12.5px; line-height: 1.2; }
  }

  /* Botones y campos */
  .btn { font: inherit; font-size: 13.5px; font-weight: 500; line-height: 1.3; color: var(--tinta); background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio-s); padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: var(--sombra); }
  .btn:hover { border-color: var(--acento); color: var(--acento); }
  .btn.primario { background: var(--acento); border-color: var(--acento); color: #fff; box-shadow: 0 1px 2px rgba(29,95,214,.3), 0 6px 14px -8px rgba(29,95,214,.8); }
  .btn.primario:hover { background: var(--acento-osc); color: #fff; }
  .btn.peligro { color: var(--rojo); }
  .btn.peligro:hover { border-color: var(--rojo); }
  .btn.chico { font-size: 12.5px; padding: 5px 10px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-txt { font: inherit; font-size: 13px; font-weight: 500; background: none; border: 0; color: var(--acento); cursor: pointer; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--acento-borde); }
  .btn-txt:hover { text-decoration-color: var(--acento); }
  input, select, textarea { font: inherit; font-size: 14px; color: var(--tinta); background: var(--papel); border: 1px solid var(--campo); border-radius: var(--radio-s); padding: 8px 11px; min-width: 0; max-width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px var(--acento-tenue); }
  input[aria-invalid="true"] { border-color: var(--rojo); }
  input[type=checkbox], input[type=radio] { width: 17px; height: 17px; accent-color: var(--acento); margin: 0; flex: none; }
  textarea { resize: vertical; min-height: 70px; width: 100%; }
  label.campo { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--suave); min-width: 0; }
  label.campo > span { font-weight: 600; letter-spacing: .02em; }
  label.campo input, label.campo select, label.campo textarea { width: 100%; }
  label.marca { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; color: var(--tinta2); cursor: pointer; line-height: 1.4; }
  label.marca input { margin-top: 2px; }
  label.marca small { display: block; color: var(--suave); font-size: 12.5px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 14px; }
  .fila-btn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* Bloques */
  .caja { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 18px 20px; min-width: 0; box-shadow: var(--sombra); }
  .caja + .caja { margin-top: 16px; }
  .dos { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 980px) { .dos { grid-template-columns: 1fr; } }
  .nota { font-size: 12.5px; color: var(--suave); }
  .franja { margin: 0 0 18px; background: var(--acento-claro); border: 1px solid var(--acento-borde); color: var(--acento-osc); border-radius: var(--radio-s); padding: 10px 14px; font-size: 14px; }
  .alerta { border-radius: var(--radio-s); padding: 10px 14px 10px 40px; font-size: 13.5px; border: 1px solid; margin: 0 0 10px; position: relative; }
  .alerta::before { content: ""; position: absolute; left: 14px; top: 15px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; box-sizing: border-box; }
  .alerta.rojo { background: var(--rojo-f); border-color: var(--rojo-b); color: #7f1d1d; }
  .alerta.rojo::before { background: var(--rojo-v); border-color: var(--rojo-v); box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
  .alerta.ambar { background: var(--ambar-f); border-color: var(--ambar-b); color: #713f12; }
  .alerta.ambar::before { background: var(--ambar-v); border-color: var(--ambar-v); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  .alerta.verde { background: var(--verde-f); border-color: var(--verde-b); color: #14532d; }
  .alerta.verde::before { background: var(--verde-v); border-color: var(--verde-v); box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .alerta b { color: inherit; }

  .sec-cab { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 16px; }
  .sec-cab h1 { font-size: 24px; line-height: 1.15; margin: 0; letter-spacing: -.02em; }
  .sec-cab p { margin: 6px 0 0; color: var(--tinta2); max-width: 780px; font-size: 14px; }

  /* Indicadores */
  .resumen { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 0 0 20px; }
  .kpi { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px 13px; min-width: 0; box-shadow: var(--sombra); position: relative; overflow: hidden; }
  .kpi::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--acento), #38bdf8); opacity: .9; }
  .kpi .eti { font-size: 11.5px; color: var(--suave); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .kpi .num { font: 650 30px/1.1 var(--sans); margin-top: 8px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi .num small { font-size: 15px; font-weight: 500; color: var(--suave); }
  .kpi .det { font-size: 12.5px; color: var(--tinta2); margin-top: 4px; }
  .kpi.oscuro { background: linear-gradient(135deg, var(--navy2), var(--navy)); border-color: var(--navy); color: #fff; }
  .kpi.oscuro::after { background: linear-gradient(90deg, #38bdf8, #a78bfa); }
  .kpi.oscuro .eti, .kpi.oscuro .det { color: #9fb0c8; }
  .kpi.oscuro .num { color: #fff; }
  @media (max-width: 1050px) { .resumen { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* Cartera de clientes */
  .cartera { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .cli { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 15px 17px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; box-shadow: var(--sombra); transition: border-color .15s, box-shadow .15s; }
  .cli:hover { border-color: var(--acento-borde); box-shadow: var(--sombra-2); }
  .cli[aria-pressed="true"] { border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-tenue); }
  .cli .top { display: flex; gap: 11px; align-items: center; }
  .sello { width: 38px; height: 38px; border-radius: 10px; color: #fff; display: grid; place-items: center; font: 700 13px/1 var(--sans); flex: none; letter-spacing: .04em; }
  .cli b { display: block; font-size: 14.5px; }
  .cli .mini { font-size: 12.5px; color: var(--suave); }
  .cli .cifras { display: flex; gap: 8px 14px; margin-top: 12px; font-size: 12.5px; color: var(--tinta2); flex-wrap: wrap; align-items: center; }
  .cli .cifras b { display: inline; font-size: 13px; }

  /* Tablas */
  .tabla { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); font-variant-numeric: tabular-nums; box-shadow: var(--sombra); }
  .tabla th { text-align: left; font-size: 11px; font-weight: 650; color: var(--suave); letter-spacing: .08em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--linea); background: var(--papel2); }
  .tabla th:first-child { border-top-left-radius: var(--radio); }
  .tabla th:last-child { border-top-right-radius: var(--radio); }
  .tabla td { padding: 11px 12px; border-bottom: 1px solid var(--linea2); vertical-align: top; font-size: 13.5px; }
  .tabla tbody tr:last-child td { border-bottom: 0; }
  .tabla tr.clic { cursor: pointer; }
  .tabla tr.clic:hover td { background: var(--papel2); }
  .tabla tr.mal td { background: var(--rojo-f); }
  .mini { display: block; font-size: 12.5px; color: var(--suave); }
  .vacio { padding: 30px 20px; text-align: center; color: var(--suave); background: var(--papel); border: 1px dashed var(--linea); border-radius: var(--radio); }
  .tabla-env { overflow-x: auto; }
  @media screen and (max-width: 760px) {
    .app { padding: 0 16px 28px; }
    .barra-app .interior { padding: 12px 16px; }
    .tabla.resp, .tabla.resp tbody, .tabla.resp tr, .tabla.resp td { display: block; width: 100%; }
    .tabla.resp thead { display: none; }
    .tabla.resp { background: none; border: 0; box-shadow: none; }
    .tabla.resp tr { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); margin-bottom: 12px; padding: 4px 14px; box-shadow: var(--sombra); }
    .tabla.resp td { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; text-align: right; }
    .tabla.resp td::before { content: attr(data-et); flex: none; color: var(--suave); font-size: 12px; text-align: left; }
    .tabla.resp td.cab { display: block; text-align: left; }
    .tabla.resp td.cab::before { display: none; }
    .tabla.resp td > * { min-width: 0; }
    .tabla.resp td:has(.razones) { flex-wrap: wrap; }
    .tabla.resp .razones { flex-basis: 100%; text-align: left; }
  }

  /* Chips de estado */
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; line-height: 1.5; letter-spacing: .01em; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.verde { background: var(--verde-f); border-color: var(--verde-b); color: var(--verde); }
  .chip.ambar { background: var(--ambar-f); border-color: var(--ambar-b); color: var(--ambar); }
  .chip.rojo { background: var(--rojo-f); border-color: var(--rojo-b); color: var(--rojo); }
  .chip.gris { background: var(--gris-f); border-color: var(--linea); color: var(--suave); }
  .chip.azul { background: var(--acento-claro); border-color: var(--acento-borde); color: var(--acento-osc); }
  .razones { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--tinta2); }
  .razones li + li { margin-top: 3px; }

  /* Línea de tiempo */
  .tiempo { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--linea); }
  .tiempo li { position: relative; padding: 0 0 14px 18px; font-size: 13.5px; }
  .tiempo li::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--papel); border: 2px solid var(--acento); box-shadow: 0 0 0 3px var(--papel); }
  .tiempo li.revoca::before { border-color: var(--rojo-v); }
  .tiempo li.acceso::before { border-color: var(--suave); }
  .tiempo .cuando { font-size: 12px; color: var(--suave); font-family: var(--mono); }
  .huella { font-family: var(--mono); font-size: 11.5px; color: var(--suave); word-break: break-all; }

  /* Diálogo */
  dialog { border: 1px solid var(--linea); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 40px); color: var(--tinta); background: var(--papel); box-shadow: var(--sombra-2); }
  dialog::backdrop { background: rgba(11, 18, 32, .55); backdrop-filter: blur(2px); }
  dialog .d-cab { padding: 16px 20px 6px; }
  dialog .d-cuerpo { padding: 8px 20px 16px; overflow: auto; max-height: calc(100vh - 190px); }
  dialog .d-pie { padding: 12px 20px; border-top: 1px solid var(--linea2); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; background: var(--papel2); border-radius: 0 0 14px 14px; }

  /* ───── Vista del titular (formulario con la marca del cliente) ───── */
  .titular-fondo { background: radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--marca, #234) 22%, transparent), transparent 70%), #eef1f5; min-height: 100vh; padding: 0 0 40px; }
  .barra-demo { background: #fffbeb; border-bottom: 1px solid var(--ambar-b); color: #713f12; font-size: 13px; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; }
  .barra-demo select { font-size: 13px; padding: 4px 8px; }
  .t-marco { max-width: 660px; margin: 28px auto 0; padding: 0 16px; }
  .t-cab { background: var(--marca, #234); color: #fff; border-radius: 16px 16px 0 0; padding: 20px 22px; display: flex; align-items: center; gap: 14px; }
  .t-cab .sello { background: rgba(255,255,255,.18); width: 46px; height: 46px; font-size: 16px; }
  .t-cab b { display: block; font-size: 17px; }
  .t-cab span { font-size: 13px; opacity: .85; }
  .t-cuerpo { background: #fff; border: 1px solid #d9dde3; border-top: 0; border-radius: 0 0 16px 16px; padding: 22px; box-shadow: var(--sombra-2); }
  .t-pasos { display: flex; gap: 6px; margin: 0 0 18px; }
  .t-pasos span { flex: 1; height: 5px; border-radius: 3px; background: #e2e6eb; }
  .t-pasos span.hecho { background: var(--marca, #234); }
  .t-cuerpo h2 { font-size: 19px; margin: 0 0 6px; }
  .t-cuerpo .lead { color: #4a5563; font-size: 14.5px; margin: 0 0 16px; }
  .t-btn { font: inherit; font-weight: 600; font-size: 15px; background: var(--marca, #234); color: #fff; border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; box-shadow: 0 4px 12px -6px color-mix(in srgb, var(--marca, #234) 70%, transparent); }
  .t-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .t-btn.sec { background: #fff; color: #2a3440; border: 1px solid #c9ced5; font-weight: 500; box-shadow: none; }
  .pol-caja { border: 1px solid #d9dde3; border-radius: 10px; height: 300px; overflow-y: auto; padding: 14px 16px; font-size: 13.5px; line-height: 1.55; color: #2a3440; background: #fafbfc; }
  .pol-caja h4 { margin: 12px 0 4px; font-size: 14px; }
  .pol-caja p { margin: 0 0 8px; }
  .pol-avance { font-size: 12.5px; color: #5d6773; margin: 6px 0 12px; }
  .fin { border: 1px solid #d9dde3; border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; transition: border-color .15s, box-shadow .15s; }
  .fin.marcada { border-color: var(--marca, #234); box-shadow: 0 0 0 1px var(--marca, #234); background: color-mix(in srgb, var(--marca, #234) 4%, #fff); }
  .fin .det { font-size: 12.8px; color: #5d6773; margin: 6px 0 0 26px; }
  .fin .det div + div { margin-top: 2px; }
  .aviso-lab { background: #f3f6f9; border-left: 3px solid var(--marca, #234); padding: 9px 12px; font-size: 13.2px; color: #33404d; border-radius: 0 8px 8px 0; margin: 0 0 14px; }
  .t-pie { text-align: center; font-size: 12px; color: #6b7480; margin-top: 14px; }

<script>
'use strict';
const CLAVE = 'mlv-consentimientos-v1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dos = (n) => String(n).padStart(2, '0');
const ahora = () => { const d = new Date(); return `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())} ${dos(d.getHours())}:${dos(d.getMinutes())}:${dos(d.getSeconds())}`; };
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fFecha = (fh) => { if (!fh) return '—'; const [y, m, d] = fh.slice(0, 10).split('-').map(Number); return `${d} ${MESES[m - 1].slice(0, 3)}. ${y}`; };
const fFechaHora = (fh) => (fh ? `${fFecha(fh)}, ${fh.slice(11, 16)}` : '—');
const corta = (h) => (h ? h.slice(0, 12) + '…' : '');

/* ───────── RUT ───────── */
function dvRut(num) { let s = 0, m = 2; for (let i = String(num).length - 1; i >= 0; i--) { s += Number(String(num)[i]) * m; m = m === 7 ? 2 : m + 1; } const r = 11 - (s % 11); return r === 11 ? '0' : r === 10 ? 'K' : String(r); }
const fmtRut = (num) => `${String(num).replace(/\B(?=(\d{3})+(?!\d))/g, '.')}-${dvRut(num)}`;
function limpiarRut(t) { const s = String(t || '').toUpperCase().replace(/[^0-9K]/g, ''); if (s.length < 2) return null; const cuerpo = s.slice(0, -1), dv = s.slice(-1); if (!/^\d{6,8}$/.test(cuerpo) || dvRut(cuerpo) !== dv) return null; return fmtRut(cuerpo); }

/* ───────── SHA-256 propio (la página no usa internet): cada anotación guarda la huella de la anterior ───────── */
const ror = (x, n) => (x >>> n) | (x << (32 - n));
const K256 = (() => { const k = [], H = []; const primo = (x) => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; }; const frac = (x) => ((x - Math.floor(x)) * 0x100000000) >>> 0; for (let n = 2; k.length < 64; n++) { if (!primo(n)) continue; if (H.length < 8) H.push(frac(Math.sqrt(n))); k.push(frac(Math.cbrt(n))); } return { k, H }; })();

  const dv = new DataView(buf.buffer); dv.setUint32(buf.length - 4, (l * 8) >>> 0); dv.setUint32(buf.length - 8, Math.floor(l / 0x20000000));

    for (let t = 16; t < 64; t++) { const a = w[t - 15], b = w[t - 2]; w[t] = (w[t - 16] + (ror(a, 7) ^ ror(a, 18) ^ (a >>> 3)) + w[t - 7] + (ror(b, 17) ^ ror(b, 19) ^ (b >>> 10))) >>> 0; }

    for (let t = 0; t < 64; t++) { const t1 = (H + (ror(E, 6) ^ ror(E, 11) ^ ror(E, 25)) + ((E & F) ^ (~E & G)) + K256.k[t] + w[t]) >>> 0; const t2 = ((ror(A, 2) ^ ror(A, 13) ^ ror(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) >>> 0; H = G; G = F; F = E; E = (D + t1) >>> 0; D = C; C = B; B = A; A = (t1 + t2) >>> 0; }
    [A, B, C, D, E, F, G, H].forEach((v, j) => { h[j] = (h[j] + v) >>> 0; });
  }
  return h.map((x) => x.toString(16).padStart(8, '0')).join('');

/* ¿Corresponde pedir consentimiento para este tratamiento? Devuelve un semáforo con las razones y su artículo. */
function evaluar(t) {
  const r = [];

  if (t.laboral && sal && !['medicina_laboral', 'ley'].includes(t.base)) {

  }
  if (t.base !== 'consentimiento') {

/* ───────── Registro con huellas encadenadas (una cadena por cliente) ───────── */
const huellaDe = (e) => sha256([e.prev, e.n, e.fecha, e.tipo, e.titular || '', JSON.stringify(e.det)].join('|'));
function registrar(c, tipo, det, titular = '', fecha = ahora()) {
  const prev = c.eventos.length ? c.eventos[c.eventos.length - 1].hash : '0'.repeat(64);
  const e = { n: c.eventos.length + 1, fecha, tipo, titular, det, prev };
  e.hash = huellaDe(e);
  c.eventos.push(e);
  return e;
}
/** Revisa toda la cadena: devuelve el número de la primera anotación alterada, o 0 si está íntegra. */
function verificar(eventos) {
  let prev = '0'.repeat(64);
  for (const e of eventos) { if (e.prev !== prev || huellaDe(e) !== e.hash) return e.n; prev = e.hash; }
  return 0;
}

const polVigente = (c) => c.politicas[c.politicas.length - 1];
function publicarPolitica(c, version, texto, fecha = ahora()) {
  const p = { version, fecha, texto, hash: sha256(texto) };
  c.politicas.push(p);
  registrar(c, 'politica', { version, hash: p.hash, caracteres: texto.length }, '', fecha);
  return p;
}
/* La identidad del titular queda fuera de la cadena (así se puede suprimir sin romperla); la cadena guarda su huella. */
function nuevoTitular(c, nombre, rutNum, relacion, rnd = Math.random) {
  const rut = typeof rutNum === 'number' ? fmtRut(rutNum) : rutNum;
  const n = c.titulares.length + 1;
  const correo = nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(' ').slice(0, 2).join('.') + '@correo.ejemplo';
  const t = { id: `${c.sigla}-${String(n).padStart(4, '0')}`, nombre, rut, correo, relacion, codigo: codigo(rnd) };
  c.titulares.push(t);
  return t;
}
const identidadHash = (t) => sha256([t.nombre, t.rut, t.correo].join('|'));
const textoFinalidad = (t) => `${t.finalidad}. Datos: ${t.datos}. Conservación: ${t.conservacion || '—'}. Destinatarios: ${t.destinatarios || 'ninguno fuera de la empresa'}.`;
function otorgar(c, tit, form, marcas, lectura, fecha, canal, formVersion = form.version) {
  const pol = c.politicas.filter((p) => p.fecha <= fecha).pop() || polVigente(c);
  const textos = {};
  for (const id of Object.keys(marcas)) { const t = c.rat.find((x) => x.id === id); if (t) textos[id] = sha256(textoFinalidad(t)).slice(0, 16); }
  return registrar(c, 'consentimiento', {
    formulario: { id: form.id, nombre: form.nombre, version: formVersion }, politica: { version: pol.version, hash: pol.hash },
    finalidades: marcas, textoMostrado: textos, lectura, canal, identidad: identidadHash(tit), comprobante: tit.codigo,
  }, tit.id, fecha);
}
function revocar(c, tit, ids, canal, fecha = ahora()) {
  return registrar(c, 'revocacion', { finalidades: ids, canal, causa: 'Sin expresión de causa (art. 12 inc. 4)', identidad: identidadHash(tit) }, tit.id, fecha);
}

/** Estado actual de cada finalidad de un titular, según su último evento. */
function estados(c, tid) {
  const m = {};
  for (const e of c.eventos) {
    if (e.titular !== tid) continue;
    if (e.tipo === 'consentimiento') for (const [k, v] of Object.entries(e.det.finalidades)) m[k] = { estado: v ? 'otorgado' : 'rechazado', ev: e, version: e.det.politica.version };
    if (e.tipo === 'revocacion') for (const k of e.det.finalidades) if (m[k]) m[k] = { ...m[k], estado: 'revocado', rev: e };
  }
  return m;
}
const ultimoConsent = (c, tid) => c.eventos.filter((e) => e.titular === tid && e.tipo === 'consentimiento').pop();
/** Titulares a los que su formulario les agregó una finalidad que no han respondido (el consentimiento dado sigue valiendo: una nueva versión de la política no lo invalida). */
function porReconfirmar(c, tit) {
  const u = ultimoConsent(c, tit.id); if (!u) return null;
  const form = c.formularios.find((f) => f.id === u.det.formulario.id);
  const faltan = form ? form.finalidades.filter((id) => !(id in u.det.finalidades)) : [];
  return faltan.length ? { version: u.det.politica.version, faltan } : null;
}
function resumen(c) {
  let vig = 0, rev = 0, rech = 0, tits = 0;
  const porFin = {};
  for (const t of c.titulares) {
    const m = estados(c, t.id); if (Object.keys(m).length) tits++;
    for (const [k, v] of Object.entries(m)) {
      porFin[k] = porFin[k] || { otorgado: 0, revocado: 0, rechazado: 0 };
      porFin[k][v.estado]++;
      if (v.estado === 'otorgado') vig++; else if (v.estado === 'revocado') rev++; else rech++;
    }
  }
  const evals = c.rat.map((t) => ({ t, ev: evaluar(t) }));
  return {
    tits, vig, rev, rech, porFin, evals,
    rojos: evals.filter((x) => x.ev.nivel === 'rojo'), ambar: evals.filter((x) => x.ev.nivel === 'ambar'),
    reconf: c.titulares.filter((t) => porReconfirmar(c, t)),
    roto: verificar(c.eventos),
  };
}

function describir(c, e) {

    }

/* CSV compatible con Excel (punto y coma, con BOM). */
const COLS = [['id', 'ID'], ['nombre', 'Actividad de tratamiento'], ['area', 'Área'], ['titulares', 'Categoría de titulares'], ['datos', 'Categorías de datos'], ['sensibilidad', 'Datos sensibles'], ['finalidad', 'Finalidad'], ['base', 'Base de licitud'], ['fundamento', 'Fundamento'], ['conservacion', 'Plazo de conservación'], ['destinatarios', 'Destinatarios'], ['transferencia', 'Transferencia internacional'], ['sistema', 'Sistema'], ['laboral', 'Relación laboral'], ['automatizada', 'Decisiones automatizadas'], ['consId', 'ID Consentimiento asociado']];
function exportarCsv() {
  const c = cli(), q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const filas = c.rat.map((t) => COLS.map(([k]) => q(k === 'titulares' ? TITULARES[t.titulares] : k === 'sensibilidad' ? SENS[t.sensibilidad] : k === 'base' ? BASES[t.base] : k === 'laboral' ? (t.laboral ? 'Sí' : 'No') : k === 'automatizada' ? (t.automatizada ? 'Sí' : 'No') : k === 'consId' ? (t.base === 'consentimiento' ? 'C-' + t.id : '') : t[k])).join(';'));

}
function parseCsv(txt) {
  txt = txt.replace(/^﻿/, '');

  const filas = []; let f = [], cel = '', com = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (com) { if (ch === '"' && txt[i + 1] === '"') { cel += '"'; i++; } else if (ch === '"') com = false; else cel += ch; }
    else if (ch === '"') com = true; else if (ch === sep) { f.push(cel); cel = ''; } else if (ch === '\n') { f.push(cel.replace(/\r$/, '')); filas.push(f); f = []; cel = ''; } else cel += ch;

}
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

  const ix = { id: col('id'), nombre: col('actividad', 'tratamiento', 'nombre'), area: col('area'), titulares: col('titular'), datos: col('categorias de datos', 'datos'), sensibilidad: col('sensib'), finalidad: col('finalidad'), base: col('base', 'licitud'), fundamento: col('fundamento'), conservacion: col('conservacion', 'plazo'), destinatarios: col('destinatario'), transferencia: col('transferencia'), sistema: col('sistema'), laboral: col('laboral'), automatizada: col('automat', 'perfil') };
  if (ix.id === cab.findIndex((h) => h.includes('consentimiento'))) ix.id = cab.findIndex((h) => h === 'id');
  const baseDe = (v) => { v = norm(v); return v.includes('consent') ? 'consentimiento' : v.includes('contrat') ? 'contrato' : v.includes('interes') ? 'interes' : v.includes('defensa') || v.includes('tribunal') ? 'defensa' : v.includes('medicina') ? 'medicina_laboral' : 'ley'; };
  const sensDe = (v) => { v = norm(v); return v.includes('salud') ? 'salud' : v.includes('biometr') ? 'biometrico' : v.includes('adolesc') ? 'adolescentes' : v.includes('nin') || v.includes('menor') ? 'ninos' : v && !['no', 'no sensibles'].includes(v) ? 'sensible' : 'no'; };

    n++;

/* ───── Registro probatorio ───── */
function vBitacora(c, r) {
  const eventos = simulacion ? simulacion.eventos : c.eventos;

  return `<div class="sec-cab"><div><h1>Registro probatorio</h1><p>Cada anotación lleva la huella SHA-256 de la anterior. Si alguien cambia, borra o intercala una anotación, la cadena se rompe desde ese punto y se nota. Sirve para cumplir el art. 12 inc. 8: «corresponde al responsable probar que contó con el consentimiento».</p></div>
    <div class="fila-btn"><button class="btn" data-acc="verificar">Verificar la cadena</button><button class="btn" data-acc="${simulacion ? 'finSim' : 'simular'}">${simulacion ? 'Terminar la simulación' : 'Simular una alteración'}</button><button class="btn" data-acc="descCadena">Descargar el registro (JSON)</button></div></div>
  ${simulacion ? `<div class="alerta rojo"><b>Simulación:</b> se cambió la anotación N° ${simulacion.n} (${esc(simulacion.que)}) sin tocar las huellas. La verificación falla desde la N° ${roto}. Nada de esto se guardó.</div>` : roto ? `<div class="alerta rojo">La cadena está rota desde la anotación N° ${roto}.</div>` : `<div class="alerta verde"><b>Cadena íntegra:</b> ${eventos.length} anotaciones verificadas. Huella de cierre: <span class="huella">${esc(eventos[eventos.length - 1].hash)}</span></div>`}

    <div class="caja"><h3>Consentimientos por finalidad</h3>${barras || '<p class="nota">Sin datos.</p>'}<div class="leyenda"><span><i style="background:var(--verde)"></i>vigente</span><span><i style="background:var(--rojo)"></i>revocado</span><span><i style="background:#b8b4aa"></i>no autorizó</span></div></div>
  </div>

function expedienteHtml(c, t, enPantalla) {

function imprimirExpediente(tid) {
  const c = cli(), t = c.titulares.find((x) => x.id === tid);
  $('imprimible').innerHTML = `<h1>Expediente de consentimiento</h1><p>${esc(c.nombre)} · RUT ${esc(c.rut)} · emitido el ${fFechaHora(ahora())} desde la plataforma de MLV Abogados (prototipo, datos ficticios).</p>${expedienteHtml(c, t, false)}`;
  if (modo === 'fiscal') registrar(c, 'acceso', { quien: c.accesoFiscal.nombre, accion: `Imprimió el expediente de ${t.id}` });
  window.print();
  render();
}

/* ───── Diálogo genérico ───── */
let alAceptar = null;
function abrirDialogo(tit, cuerpo, botones, fn) {
  $('dlgTit').textContent = tit; $('dlgCuerpo').innerHTML = cuerpo;
  $('dlgPie').innerHTML = botones.map(([v, e, cls]) => `<button class="btn ${cls || ''}" value="${v}">${esc(e)}</button>`).join('');

}
$('dlg').addEventListener('close', () => { if ($('dlg').returnValue === 'ok' && alAceptar) alAceptar($('dlgForm')); alAceptar = null; });
$('dlgForm').addEventListener('submit', (ev) => {
  if (ev.submitter && ev.submitter.value === 'ok' && alAceptar && alAceptar($('dlgForm')) === false) { ev.preventDefault(); return; }
  if (ev.submitter && ev.submitter.value === 'ok') { ev.preventDefault(); alAceptar = null; $('dlg').close(); }
});

      const m = estados(c, R.tit.id), vig = Object.entries(m).filter(([, v]) => v.estado === 'otorgado');
      cuerpo = `<h2>Hola, ${esc(R.tit.nombre.split(' ')[0])}</h2><p class="lead">Estas son sus autorizaciones vigentes. Marque las que quiere retirar.</p>
        ${vig.length ? vig.map(([id]) => `<div class="fin"><label class="marca"><input type="checkbox" data-trev="${esc(id)}" ${R.sel[id] ? 'checked' : ''}><span><b>${esc(c.rat.find((t) => t.id === id).nombre)}</b><small>Autorizada el ${fFecha(m[id].ev.fecha)}</small></span></label></div>`).join('') + `<div class="fila-btn"><button class="t-btn sec" data-t="revNueva">Cancelar</button><button class="t-btn" data-t="revocar">Retirar las marcadas</button></div>` : '<p>No tiene autorizaciones vigentes.</p><button class="t-btn sec" data-t="revNueva">Volver</button>'}`;
    } else cuerpo = `<h2>Retirar o cambiar mi autorización</h2><p class="lead">Use su RUT y el código del comprobante que recibió al autorizar. Es gratis y no necesita explicar el motivo.</p>
      <div style="display:grid;gap:12px"><label class="campo"><span>RUT</span><input id="rRut" value="${esc(R.rut)}" autocomplete="off"></label><label class="campo"><span>Código del comprobante</span><input id="rCod" value="${esc(R.cod)}" placeholder="ABCD-1234" autocomplete="off"></label></div>
      <p class="nota" style="color:var(--rojo)">${esc(R.error)}</p>
      <div class="fila-btn"><button class="t-btn" data-t="revBuscar">Continuar</button>${c.titulares[0] ? `<button class="t-btn sec" data-t="revDemo">Usar un titular de ejemplo</button>` : ''}</div>`;
  }
  $('titular').innerHTML = `<div class="titular-fondo" style="--marca:${esc(c.color)}">
    <div class="barra-demo"><span>Así lo ve el trabajador o titular (desde un enlace o código QR).</span>
      <label>Cliente <select id="tCli">${db.clientes.map((k) => `<option value="${k.id}" ${k.id === c.id ? 'selected' : ''}>${esc(k.nombre)}</option>`).join('')}</select></label>
      <label>Formulario <select id="tForm">${c.formularios.map((x) => `<option value="${x.id}" ${x.id === f.id ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select></label>
      <button class="btn chico" data-modo="mlv">Volver al equipo MLV</button></div>
    <div class="t-marco"><div class="t-cab">${selloCli(c, 46)}<div><b>${esc(c.nombre)}</b><span>Privacidad y autorizaciones</span></div></div>
      <div class="t-cuerpo"><div class="t-tabs"><button data-t="tabDar" ${T.tab === 'dar' ? 'aria-current="page"' : ''}>Dar mi autorización</button><button data-t="tabRev" ${T.tab === 'rev' ? 'aria-current="page"' : ''}>Retirar o cambiar</button></div>${cuerpo}</div>
      <div class="t-pie">Responsable: ${esc(c.nombre)} · ${esc(c.correo)} · <button class="btn-txt" data-t="verPolT">Política v${esc(pol.version)}</button><br>Plataforma de consentimientos de MLV Abogados · prototipo con datos ficticios</div></div></div>`;
  if (T.paso === 2 && T.tab === 'dar') { T.pol.abierta = true; T.pol.t0 = Date.now(); revisarScroll(); }
}
function revisarScroll() {
  const b = $('polCaja'); if (!b) return;
  if (b.scrollTop + b.clientHeight >= b.scrollHeight - 8) { T.pol.alFinal = true; const a = $('polAvance'); if (a) a.textContent = '✓ Llegó al final del texto.'; }
}
const pararReloj = () => { if (T && T.pol.t0) { T.pol.ms += Date.now() - T.pol.t0; T.pol.t0 = 0; } };

function accionTitular(k, el) {
  const c = cli();
  const leer1 = () => { if ($('tNombre')) { T.nombre = $('tNombre').value; T.rut = $('tRut').value; T.correo = $('tCorreo').value; } };
  switch (k) {
    case 'tabDar': T.tab = 'dar'; break;
    case 'tabRev': pararReloj(); T.tab = 'rev'; break;
    case 'relleno': { const n = NOMBRES[Math.floor(Math.random() * NOMBRES.length)].split(' '); const nom = `${['Daniela', 'Pablo', 'Carolina', 'Andrés', 'Paula', 'Rodrigo'][Math.floor(Math.random() * 6)]} ${n[1]} ${n[2]}`; T.nombre = nom; T.rut = fmtRut(10000000 + Math.floor(Math.random() * 12000000)); T.correo = norm(nom).split(' ').slice(0, 2).join('.') + '@correo.ejemplo'; break; }
    case 'paso1': pararReloj(); T.paso = 1; break;
    case 'paso2': {
      if (T.paso === 1) { leer1(); const rut = limpiarRut(T.rut); const err = !T.nombre.trim() ? 'Escriba su nombre.' : !rut ? 'El RUT no es válido.' : !/^\S+@\S+\.\S+$/.test(T.correo) ? 'Revise el correo.' : ''; if (err) { $('tErr').textContent = err; return; } T.rut = rut; }
      T.paso = 2; break;
    }
    case 'paso3': pararReloj(); T.paso = 3; break;
    case 'enviar': {
      const f = c.formularios.find((x) => x.id === T.formId);
      let tit = c.titulares.find((t) => t.rut === T.rut);
      if (!tit) tit = nuevoTitular(c, T.nombre.trim(), T.rut, f.publico); else { tit.nombre = T.nombre.trim(); tit.correo = T.correo; }
      tit.correo = T.correo;
      const marcas = {}; f.finalidades.forEach((id) => { marcas[id] = !!T.marcas[id]; });
      T.hecho = otorgar(c, tit, f, marcas, { abierta: T.pol.abierta, alFinal: T.pol.alFinal, segundos: Math.round(T.pol.ms / 1000), declarada: T.pol.declarada }, ahora(), /Mobi/.test(navigator.userAgent) ? 'Formulario web (celular)' : 'Formulario web (computador)');
      T.paso = 4; guardar(); break;
    }
    case 'otra': iniciarTitular(T.formId); break;
    case 'irRev': T.tab = 'rev'; T.rev = { rut: T.rut, cod: T.hecho ? T.hecho.det.comprobante : '', tit: null, sel: {}, hecho: null, error: '' }; break;
    case 'revDemo': { const t = c.titulares.find((x) => Object.values(estados(c, x.id)).some((v) => v.estado === 'otorgado')); if (t) { T.rev.rut = t.rut; T.rev.cod = t.codigo; } break; }
    case 'revBuscar': {
      T.rev.rut = $('rRut').value; T.rev.cod = $('rCod').value;
      const rut = limpiarRut(T.rev.rut), t = c.titulares.find((x) => x.rut === rut);
      if (!t || t.codigo !== T.rev.cod.trim().toUpperCase()) { T.rev.error = 'El RUT y el código no coinciden.'; break; }
      T.rev.tit = t; T.rev.error = ''; T.rev.sel = {}; break;
    }
    case 'revocar': { const ids = Object.keys(T.rev.sel).filter((k2) => T.rev.sel[k2]); if (!ids.length) return; T.rev.hecho = revocar(c, T.rev.tit, ids, 'Formulario web (mismo medio)'); guardar(); break; }
    case 'revNueva': T.rev = { rut: '', cod: '', tit: null, sel: {}, hecho: null, error: '' }; break;
    case 'verPolT': verPolitica(c); return;
    default: return;
  }
  pintarTitular();
}

/* ───────── Eventos ───────── */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-modo],[data-ruta],[data-cli],[data-acc],[data-trat],[data-ficha],[data-expediente],[data-abrir-form],[data-t],[data-verpol],[data-rutdemo]');
  if (!el) return;
  const c = cli(), d = el.dataset;
  if (d.modo) {
    if (modo === 'titular') pararReloj();
    modo = d.modo; simulacion = null;
    if (modo === 'titular') iniciarTitular();
    if (modo === 'fiscal') { fiscExp = null; fiscConsulta = ''; registrar(c, 'acceso', { quien: c.accesoFiscal.nombre, accion: 'Ingresó al panel (solo lectura)' }); }
    history.replaceState(null, '', modo === 'mlv' ? location.pathname : '#' + modo);
    render(); window.scrollTo(0, 0); return;
  }
  if (d.ruta) { ruta = d.ruta; fichaId = null; simulacion = null; render(); return; }
  if (d.cli) { db.actual = d.cli; fichaId = null; render(); return; }
  if (d.trat) { editarTrat(d.trat); return; }
  if (d.ficha) { fichaId = d.ficha; render(); window.scrollTo(0, 0); return; }
  if (d.expediente) { imprimirExpediente(d.expediente); return; }
  if (d.abrirForm) { modo = 'titular'; iniciarTitular(d.abrirForm); render(); window.scrollTo(0, 0); return; }
  if (d.t) { accionTitular(d.t, el); return; }
  if (d.verpol) { verPolitica(c, c.politicas.find((p) => p.version === d.verpol)); return; }
  if (d.rutdemo) { $('fiscRut').value = d.rutdemo; return; }
  switch (d.acc) {
    case 'reiniciar': if (confirm('¿Borrar los cambios y volver a los datos de ejemplo?')) { db = semilla(); fichaId = null; render(); } break;
    case 'nuevoTrat': editarTrat(null); break;
    case 'csvPlantilla': exportarCsv(); break;
    case 'nuevaPol': nuevaPolitica(); break;
    case 'verPol': verPolitica(c); break;
    case 'volverTit': fichaId = null; render(); break;
    case 'revocarOtro': {
      const t = c.titulares.find((x) => x.id === fichaId), vig = Object.entries(estados(c, t.id)).filter(([, v]) => v.estado === 'otorgado');
      if (!vig.length) { alert('No tiene autorizaciones vigentes.'); break; }
      abrirDialogo('Anotar revocación', `<p class="nota">Para revocaciones que llegan por correo, carta o en persona. Queda en el registro con el canal indicado.</p><div style="display:grid;gap:8px">${vig.map(([id]) => `<label class="marca"><input type="checkbox" name="f_${esc(id)}"> ${esc(id)} · ${esc(c.rat.find((x) => x.id === id).nombre)}</label>`).join('')}</div><label class="campo" style="margin-top:12px"><span>Canal</span><select name="canal"><option>Correo electrónico (anotado por la empresa)</option><option>Carta (anotado por la empresa)</option><option>En persona (anotado por la empresa)</option></select></label>`,
        [['cancelar', 'Cancelar'], ['ok', 'Anotar', 'primario']], (f) => { const v = leerForm(f); const ids = vig.map(([id]) => id).filter((id) => v['f_' + id]); if (!ids.length) return false; revocar(c, t, ids, v.canal); render(); });
      break;
    }
    case 'verificar': { const n = verificar(c.eventos); alert(n ? `La cadena está rota desde la anotación N° ${n}.` : `Cadena íntegra: ${c.eventos.length} anotaciones verificadas.`); break; }
    case 'simular': {
      const copia = JSON.parse(JSON.stringify(c.eventos));
      const obj = copia.find((e) => e.tipo === 'revocacion') || copia[Math.floor(copia.length / 2)];
      if (obj.tipo === 'revocacion') { obj.fecha = obj.fecha.replace(/^2026-10/, '2026-11'); }
      else obj.fecha = obj.fecha.replace(/:\d\d$/, ':00');
      simulacion = { eventos: copia, n: obj.n, que: obj.tipo === 'revocacion' ? 'se corrió un mes la fecha de una revocación' : 'se cambió la hora' };
      render(); break;
    }
    case 'finSim': simulacion = null; render(); break;
    case 'descCadena': {
      if (modo === 'fiscal') registrar(c, 'acceso', { quien: c.accesoFiscal.nombre, accion: 'Descargó el registro completo' });
      descargar(`registro-${c.sigla}-${ahora().slice(0, 10)}.json`, JSON.stringify({ responsable: { nombre: c.nombre, rut: c.rut }, generado: ahora(), algoritmo: 'SHA-256 de prev|n|fecha|tipo|titular|JSON(det)', politicas: c.politicas.map(({ version, fecha, hash }) => ({ version, fecha, hash })), eventos: c.eventos }, null, 2));
      render(); break;
    }
    case 'descVerificador': descargar('como-verificar.txt', `Cómo verificar el registro de consentimientos\n\n1. Abra el archivo JSON del registro.\n2. Para cada anotación, en orden, una con "|" estos campos: prev, n, fecha, tipo, titular (vacío si no hay) y det (como JSON compacto, sin espacios).\n3. Calcule el SHA-256 de ese texto (UTF-8). Debe ser igual a "hash".\n4. El "prev" de cada anotación debe ser igual al "hash" de la anterior. La primera usa 64 ceros.\n5. Si una sola anotación fue cambiada, borrada o intercalada, la verificación falla desde ahí.\n6. Cada política publicada tiene su huella: SHA-256 del texto completo.\n`, 'text/plain'); break;
    case 'fiscBuscar': {
      fiscConsulta = $('fiscRut').value; const rut = limpiarRut(fiscConsulta), t = c.titulares.find((x) => x.rut === rut);
      fiscExp = t || null;
      if (t) registrar(c, 'acceso', { quien: c.accesoFiscal.nombre, accion: `Consultó el expediente de ${t.id}` });
      else alert(rut ? 'No hay registros para ese RUT.' : 'El RUT no es válido.');
      render(); break;
    }
    default: break;
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target, c = cli();
  if (el.id === 'csvImport' && el.files[0]) { const r = new FileReader(); r.onload = () => importarCsv(String(r.result)); r.readAsText(el.files[0]); return; }
  if (el.dataset.fin) {
    const [fid, tid] = el.dataset.fin.split('|'), f = c.formularios.find((x) => x.id === fid);
    f.finalidades = el.checked ? [...f.finalidades, tid].sort() : f.finalidades.filter((x) => x !== tid);
    f.version++;
    registrar(c, 'formulario', { id: f.id, nombre: f.nombre, version: f.version, finalidades: f.finalidades });
    render(); return;
  }
  if (el.dataset.marca) { c[el.dataset.marca] = el.value; render(); return; }
  if (el.id === 'tCli') { db.actual = el.value; iniciarTitular(); render(); return; }
  if (el.id === 'tForm') { iniciarTitular(el.value); render(); return; }
  if (el.id === 'tDecl') { T.pol.declarada = el.checked; $('tSig2').disabled = !el.checked; return; }
  if (el.dataset.tfin) { T.marcas[el.dataset.tfin] = el.checked; el.closest('.fin').classList.toggle('marcada', el.checked); return; }
  if (el.dataset.trev) { T.rev.sel[el.dataset.trev] = el.checked; return; }
});
document.addEventListener('input', (ev) => { if (ev.target.id === 'buscarTit') { filtroTit = ev.target.value; const pos = ev.target.selectionStart; render(); const b = $('buscarTit'); b.focus(); b.setSelectionRange(pos, pos); } });
document.addEventListener('scroll', (ev) => { if (ev.target.id === 'polCaja') revisarScroll(); }, true);

db = cargar();
// Enlaces directos para la demostración: #titular abre el formulario; #fiscal, el panel del fiscalizador.
const inicial = location.hash.replace('#', '');
if (inicial === 'titular') { modo = 'titular'; iniciarTitular(); } else if (inicial === 'fiscal') modo = 'fiscal';
else if (['rat', 'formularios', 'titulares', 'bitacora', 'como'].includes(inicial)) ruta = inicial;
render();
</script>
</body>
</html>
